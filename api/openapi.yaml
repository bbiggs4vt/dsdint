openapi: 3.1.0

# ---------------------------------------------------------------------------
# dsd-server WebSocket JSON interface — OpenAPI 3.1 description.
#
# dsd-server speaks a *WebSocket* protocol, which OpenAPI does not model
# natively (OpenAPI describes request/response HTTP operations). This file
# therefore documents:
#
#   * the single GET endpoint that performs the WebSocket upgrade, and
#   * every JSON text frame that travels each direction, as reusable JSON
#     Schemas under components/schemas.
#
# The message schemas — not the (placeholder) path operation — are the
# useful part: point Swagger UI / Redoc / RapiDoc at this file to explore,
# validate, and copy example frames interactively. For a spec that models
# the bidirectional message flow accurately (channels + messages rather than
# request/response), see the companion asyncapi.yaml.
#
# Source of truth for the wire format is PROTOCOL.md (generated from
# session.cpp). Keep the two in sync.
# ---------------------------------------------------------------------------

info:
  title: dsd-server WebSocket JSON interface
  version: "1.0.0"
  summary: FM-demodulate SDR IQ and decode digital voice over a WebSocket.
  description: |
    One WebSocket connection = one session = one FM demod + one digital-voice
    decoder. The client streams interleaved little-endian `float32` IQ as
    **binary** frames and drives the pipeline with **text** frames carrying
    flat JSON control messages; the server replies with flat JSON text frames
    (`started` / `error` / `event`) and tagged binary audio frames.

    **All JSON objects are flat** — no nesting, no arrays — and every
    documented key is **always present** in the frames that carry it. A field
    whose value is unknown is the empty string `""`, never omitted and never
    `null`. (proto3-style default omission does not apply here; the server
    always emits every key.)

    This OpenAPI file describes the JSON text frames. The two binary frame
    types are described only prose-wise (OpenAPI has no vocabulary for raw
    little-endian sample blobs):

    * **client → server IQ**: interleaved LE `float32` I/Q pairs
      (`I0,Q0,I1,Q1,…`) at the `sample_rate` given to `start`; byte length
      must be a multiple of 8.
    * **server → client audio**: a 1-byte tag `0x01` followed by little-endian
      signed-16-bit PCM (8 kHz; stereo on the dsd-fme backend, mono on DSDcc).

    See `PROTOCOL.md` in the repository for the full narrative, per-protocol
    field-population tables, the `extra` token vocabulary, and real captured
    examples.
  license:
    name: See repository

servers:
  - url: ws://{host}:{port}
    description: dsd-server WebSocket endpoint (ws:// — no TLS by default).
    variables:
      host:
        default: localhost
      port:
        default: "8080"

# ---------------------------------------------------------------------------
# The upgrade endpoint. OpenAPI can only express the initial HTTP GET that
# is upgraded to a WebSocket; everything after the 101 is message traffic,
# documented via the schemas below.
# ---------------------------------------------------------------------------
paths:
  /:
    get:
      operationId: connect
      summary: Open the WebSocket session (HTTP Upgrade).
      description: |
        A standard WebSocket handshake: `GET` with `Upgrade: websocket`. On
        success the server replies `101 Switching Protocols` and the
        connection becomes a full-duplex session. There is no path routing —
        the server accepts the upgrade on any path — and no subprotocol is
        negotiated. After the upgrade, exchange the frames defined in
        `components/schemas`.
      responses:
        "101":
          description: Switching Protocols — the WebSocket session is open.
        "400":
          description: Not a valid WebSocket upgrade request.

# ---------------------------------------------------------------------------
components:
  schemas:

    # ================================================= client -> server ====

    ControlMessage:
      title: Control message (client → server)
      description: |
        Any text frame the client sends. A flat JSON object selected by its
        `type` field. Parse/emit via the concrete variant that matches `type`.
      oneOf:
        - $ref: "#/components/schemas/StartRequest"
        - $ref: "#/components/schemas/SetGainRequest"
        - $ref: "#/components/schemas/SetFreqOffsetRequest"
        - $ref: "#/components/schemas/StopRequest"
      discriminator:
        propertyName: type
        mapping:
          start: "#/components/schemas/StartRequest"
          set_gain: "#/components/schemas/SetGainRequest"
          set_freq_offset: "#/components/schemas/SetFreqOffsetRequest"
          stop: "#/components/schemas/StopRequest"

    StartRequest:
      title: start
      type: object
      description: |
        Build the demod + digital-voice decode pipeline. If a pipeline is
        already running it is stopped and rebuilt (clean restart). The server
        replies `started` on success, `error` on failure. Every numeric/bool
        field is optional; an omitted field takes the default shown.
      required: [type]
      additionalProperties: false
      properties:
        type:
          const: start
        sample_rate:
          type: number
          default: 2000000
          description: IQ sample rate in Hz of the binary frames you will stream.
        channel_bandwidth:
          type: number
          default: 12500
          description: Channel bandwidth in Hz; sets the demod's channel filter.
        freq_offset:
          type: number
          default: 0
          description: |
            NCO shift in Hz. **Positive means the channel of interest sits
            above 0 Hz in your IQ**; the server mixes it down to baseband.
        gain:
          type: number
          default: 26000
          description: Discriminator output gain (linear scale into the decoder).
        afc:
          type: boolean
          default: false
          description: |
            Automatic frequency control. When true the demod measures the
            residual carrier offset in its own discriminator output and steers
            the NCO to remove it (SDR ppm error, slow drift), variance-gated so
            no-signal noise never pulls it, clamped to ±5 kHz.
        protocol:
          allOf:
            - $ref: "#/components/schemas/ProtocolHint"
          default: ""
          description: |
            Advisory hint for which digital-voice protocol the signal is, so
            the decoder runs that mode instead of auto-detecting. Forgiving:
            case-insensitive, and spaces/underscores/hyphens are ignored.
        key_type:
          allOf:
            - $ref: "#/components/schemas/KeyType"
          default: ""
          description: |
            Optional decryption scheme. `""` (default) means no key. A named
            scheme with a missing/invalid `key` is rejected with an `error` and
            the pipeline is not started. **Only `bp` (DMR Basic Privacy) works
            on both backends**; every other scheme is dsd-fme-backend only.
        key:
          type: string
          default: ""
          description: |
            Key value for `key_type`. Decimal or hex digits (AES/Hytera keys
            may include the spaces that separate dsd-fme's 64-bit hex words);
            no other characters accepted. For `bp` it is a decimal key *number*
            `1`–`255` selecting a well-known built-in BP key — a BP key XORs
            every DMR voice frame, so setting one on an unencrypted channel
            garbles audio.
      examples:
        - type: start
          sample_rate: 2400000
          channel_bandwidth: 12500
          freq_offset: -25000
          gain: 26000
          afc: true
          protocol: dmr
        - type: start
          sample_rate: 2000000
          protocol: p25p2
        - type: start
          protocol: dmr
          key_type: bp
          key: "1"

    SetGainRequest:
      title: set_gain
      type: object
      description: Live-adjust discriminator gain. No reply. Ignored if no pipeline is running.
      required: [type]
      additionalProperties: false
      properties:
        type:
          const: set_gain
        gain:
          type: number
          default: 26000
      examples:
        - type: set_gain
          gain: 32000

    SetFreqOffsetRequest:
      title: set_freq_offset
      type: object
      description: |
        Live-retune the NCO shift (same sign convention as `start.freq_offset`).
        No reply. Ignored if no pipeline is running. Also resets any accumulated
        AFC correction — an explicit retune is a statement of new truth.
      required: [type]
      additionalProperties: false
      properties:
        type:
          const: set_freq_offset
        hz:
          type: number
          default: 0
      examples:
        - type: set_freq_offset
          hz: 12500

    StopRequest:
      title: stop
      type: object
      description: |
        Tear down the pipeline (kill the dsd-fme child / destroy the decoder).
        No reply. The WebSocket stays open; a new `start` is accepted afterwards.
      required: [type]
      additionalProperties: false
      properties:
        type:
          const: stop
      examples:
        - type: stop

    # ================================================= server -> client ====

    ServerMessage:
      title: Server message (server → client)
      description: Any JSON text frame the server sends. Dispatch on `type`.
      oneOf:
        - $ref: "#/components/schemas/Started"
        - $ref: "#/components/schemas/ErrorMessage"
        - $ref: "#/components/schemas/Event"
      discriminator:
        propertyName: type
        mapping:
          started: "#/components/schemas/Started"
          error: "#/components/schemas/ErrorMessage"
          event: "#/components/schemas/Event"

    Started:
      title: started
      type: object
      description: |
        Sent once per successful `start`, before any `event` or audio frame
        from that pipeline.
      required: [type, udp_audio_port]
      additionalProperties: false
      properties:
        type:
          const: started
        udp_audio_port:
          type: integer
          minimum: 0
          description: |
            Server-internal UDP port the dsd-fme child streams decoded audio to
            (40000–59000, per session). Purely informational — the client never
            talks to it; audio arrives over the WebSocket. `0` on the DSDcc
            backend (no subprocess, no UDP) means "not applicable", not "failed".
      examples:
        - type: started
          udp_audio_port: 44251
        - type: started
          udp_audio_port: 0

    ErrorMessage:
      title: error
      type: object
      description: |
        Something was rejected. **The connection stays open** — only the
        offending message is affected. Branch on the prefix up to the first
        `:`; treat the remainder as free text.
      required: [type, message]
      additionalProperties: false
      properties:
        type:
          const: error
        message:
          type: string
          description: |
            One of four texts: `unknown message type: <type>`,
            `bad control message: <parser detail>`,
            `binary frame length not a multiple of 8 bytes`,
            `failed to start DSD backend`.
          examples:
            - "unknown message type: frobnicate"
            - "bad control message: unexpected token"
            - "binary frame length not a multiple of 8 bytes"
            - "failed to start DSD backend"
      examples:
        - type: error
          message: "failed to start DSD backend"

    Event:
      title: event
      type: object
      description: |
        One frame per line the decoder reports (dsd-fme backend: one per
        cleaned log line; DSDcc backend: one per detected state change). **All
        twelve data fields are always present**; empty string means "not
        present in this event". Which fields carry a value depends on the
        protocol and backend — see PROTOCOL.md for the full population table.
      required:
        [type, kind, talkgroup, source_id, slot, color_code, ran, nac,
         emergency, alias, crc_error, extra, raw]
      additionalProperties: false
      properties:
        type:
          const: event
        kind:
          $ref: "#/components/schemas/EventKind"
        talkgroup:
          type: string
          description: |
            Decimal talkgroup / group-call target ID, or a **callsign** for
            D-STAR/YSF (e.g. `CQCQCQ`), or `""`. A string because IDs can
            exceed assumed integer widths.
        source_id:
          type: string
          description: Decimal source radio ID, or a callsign for D-STAR/YSF, or `""`.
        slot:
          type: string
          enum: ["", "1", "2"]
          description: DMR TDMA slot, or `""` when not slot-specific.
        color_code:
          type: string
          description: DMR color code / dPMR channel code as bare decimal (no leading zeros), or `""`.
        ran:
          type: string
          description: NXDN Radio Access Number as bare decimal, or `""`.
        nac:
          type: string
          description: P25 Network Access Code as uppercase hex without `0x`, or `""`. dsd-fme backend only.
        emergency:
          type: string
          enum: ["", "1"]
          description: '`"1"` when the line flags an emergency, else `""`. dsd-fme backend only.'
        alias:
          type: string
          description: DMR talker-alias text, else `""`. dsd-fme backend only.
        crc_error:
          type: string
          enum: ["", "1"]
          description: |
            `"1"` when the decoder marked this line/burst as failing an FEC/CRC
            check, else `""`. When set, treat the event's other fields
            (especially `color_code`) as unreliable.
        extra:
          type: string
          description: |
            Zero or more `key=value` tokens joined by `"; "`, carrying
            backend/protocol-specific detail (e.g. `burst=VOX`, `rpt1=…`,
            `call_mode=group_cq`, `site_id=3`), or `""`. See PROTOCOL.md for the
            full token vocabulary.
        raw:
          type: string
          description: |
            The underlying decoder output this event was parsed from (cleaned
            dsd-fme log line, or a synthesized DSDcc description). Free text that
            varies across dsd-fme versions — parse the structured fields; fall
            back to `raw` only for display/debug.
      examples:
        - type: event
          kind: sync
          talkgroup: ""
          source_id: ""
          slot: "2"
          color_code: "4"
          ran: ""
          nac: ""
          emergency: ""
          alias: ""
          crc_error: ""
          extra: ""
          raw: "20:37:20 Sync: +DMR   slot1  [SLOT2] | Color Code=04 | VC6 "
        - type: event
          kind: call
          talkgroup: "19535"
          source_id: "2222223"
          slot: "2"
          color_code: ""
          ran: ""
          nac: ""
          emergency: ""
          alias: ""
          crc_error: ""
          extra: ""
          raw: " SLOT 2 TGT=19535 SRC=2222223 Group Call  "

    # ================================================= shared enums ========

    ProtocolHint:
      title: Protocol hint
      type: string
      description: |
        Advisory digital-voice protocol selector. Matching is forgiving
        (case-insensitive; spaces/underscores/hyphens ignored) and accepts
        documented aliases; the canonical values are listed here. `""`/`auto`
        and any unrecognized value fall back to the server default (DMR) /
        auto-detect respectively.
      enum:
        - ""
        - dmr
        - nxdn48
        - nxdn96
        - p25
        - p25p2
        - dpmr
        - dstar
        - ysf
        - auto

    KeyType:
      title: Decryption scheme
      type: string
      description: |
        Optional decryption scheme naming how `key` is interpreted. `""` means
        no key. Only `bp` works on both backends; the rest are dsd-fme-backend
        only. Matching is forgiving and accepts aliases (e.g. `basic_privacy`,
        `aes128`, `nxdn_scrambler`).
      enum:
        - ""
        - bp
        - rc4
        - des
        - aes
        - hytera
        - scrambler

    EventKind:
      title: Event kind
      type: string
      description: |
        Best-effort classification of an `event`. `burst` is DSDcc/DMR-only.
        On the dsd-fme backend, `unknown` events (startup banner / version /
        device-config noise) are suppressed by default.
      enum:
        - voice
        - sync
        - call
        - burst
        - unknown
